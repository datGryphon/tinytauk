[model]
model_id = "tencent/AuK-Flash"
qwen_model_id = "Qwen/Qwen2.5-Omni-3B"

[conditioner]
backend = "transformers"
device = "cpu"
dtype = "fp32"
quantization = "none"

[generator]
backend = "pytorch"
device = "cpu"
dtype = "fp32"
quantization = "int8"

[vae]
backend = "pytorch"
device = "cpu"
dtype = "fp32"
quantization = "none"
compile = true
compile_mode = "default"
compile_dynamic = true

[runtime]
seed = 1234
num_threads = 4
