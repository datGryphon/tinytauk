[model]
model_id = "tencent/AuK-Flash"
qwen_model_id = "Qwen/Qwen2.5-Omni-3B"

[conditioner]
backend = "transformers"
device = "cpu"
dtype = "fp32"
quantization = "int8-weight-only"

[generator]
backend = "pytorch"
device = "cpu"
dtype = "bf16"
quantization = "int4-weight-only"

[vae]
backend = "pytorch"
device = "cpu"
dtype = "fp32"
quantization = "none"
compile = false

[runtime]
seed = 1234
num_threads = 4
