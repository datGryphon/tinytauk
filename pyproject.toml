[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tinytauk"
version = "0.2.0"
description = "Memory-efficient AuK-Flash inference runtime"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY.md"]
authors = [
  { name = "TinyTAuK contributors" },
]
dependencies = [
  "audioread>=3.0",
  "einops>=0.8",
  "huggingface-hub>=0.35",
  "numpy>=1.26",
  "omegaconf>=2.3",
  "qwen-omni-utils>=0.0.9",
  "safetensors>=0.5",
  "torch==2.7.1",
  "torchao==0.12.0",
  "torchaudio==2.7.1",
  "torchvision==0.22.1",
  "transformers>=4.52,<5",
  "x-transformers>=1.31.14",
]

[project.optional-dependencies]
reference = [
  "torchdiffeq",
]

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
]

[project.scripts]
tinytauk = "tinytauk.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchao = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/tinytauk"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
